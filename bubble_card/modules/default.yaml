default:
  name: Default
  version: ''
  creator: ''
  supported:
    - pop-up
  description: Empty and enabled by default. Add your custom styles and/or JS templates here to apply them to all cards by pressing the <ha-icon icon="mdi:pencil"></ha-icon> button above.
  code: |-
    .bubble-pop-up {
      height: unset !important;
      max-height: 100vh !important;
      box-shadow: var(--mdc-dialog-box-shadow) !important;
      z-index: 7 !important;
    }
    .bubble-backdrop.is-visible {
      backdrop-filter: blur(10px);
      z-index: 6;
    }
    .bubble-backdrop.is-visible {
      backdrop-filter: ${hass.panelUrl == 'fire-tablet' ? 'brightness(20%) !important' : 'blur(10px) !important'};
      z-index: 6;
    }
  is_global: true
