cardmod:
  ## CSS styling for Sidebar
  card-mod-sidebar-yaml: |
    .: |
      * {
        font-family: "SF Pro Display", sans-serif;
      }
      @media screen and (max-width:870px){
        .menu {
          height: var(--header-height) !important;
        }
      }
      .menu .title {
        font-weight: 500;
      }

  ## CSS styling for Entity cards
  card-mod-row-yaml: |
    ## class: bar_card. bar-card as an entity row; the class lands on the row element.
    .: |
      :host(.bar_card) bar-card-card {
        --paper-item-icon-active-color: var(--accent-color);
      }
      :host(.bar_card) bar-card-value {
        font-weight: 300;
        line-height: 36px;
        padding-right: 5px;
      }
      :host(.bar_card) bar-card-indicator {
        margin-top: 5px;
        border-radius: 0;
      }
      :host(.bar_card) bar-card-backgroundbar {
        background: var(--paper-card-background-color);
        border-radius: 5px;
      }
      :host(.bar_card) bar-card-currentbar {
        border-radius: 5px;
      }
    hui-generic-entity-row:
      $:
        state-badge:
          $: |
            :host {
              border: var(--theme-icon-border);
              outline: var(--theme-icon-outline);
              border-radius: 100px;
              overflow: hidden;
            }
            ha-state-icon {
              display: flex;
              align-items: center;
              justify-content: center;
              height: 100%;
              padding: 0 10px;
              --mdc-icon-size: 20px;
              --ha-icon-display: block;
              background: var(--theme-icon-background);
              color: var(--theme-icon-color);

              {% set ent = config.entity %}
              {% if ent and states(ent) not in ['unknown', 'unavailable'] %}
                {% set state = states(ent) %}
                {% set class = config.card_mod.class if config.card_mod and config.card_mod.class else '' %}
                
                {% if ent is search("sensor.*_battery$") %}
                  {% set val = state | int(0) %}
                  background: {{ 'var(--color-red)' if val < 30 else 'var(--color-orange)' if val < 70 else 'var(--color-green)' }} !important;
                  color: #fff !important;
                {% elif ent is search("device_tracker.*_bt_tracker$") %}
                  background: {{ 'var(--color-red)' if state == 'not_home' else 'var(--color-green)' }} !important;
                  color: #fff !important;
                {% elif 'drive_time' in class %}
                  {% set val = state | int(0) %}
                  background: {{ 'var(--color-green)' if val <= 10 else 'var(--color-orange)' if val <= 20 else 'var(--color-red)' }} !important;
                  color: #fff !important;
                {% endif %}
              {% endif %}
            }


  ## CSS styling for Glance cards
  card-mod-glance-yaml: |
    .: |
      .name {
        font-weight: 600;
        order:2;
      }
      div {
        order:3;
      }
    state-badge$: |        
      :host {
        width: 50px !important;
        height: 50px !important;
        order:1;
      }
      ha-state-icon {
        background: var(--theme-icon-background);
        border: var(--theme-icon-border);
        outline: var(--theme-icon-outline);
        padding: 10px;
        color: var(--theme-icon-color) !important;
        border-radius: 100px;
      }
      ha-state-icon[data-state="normal"], ha-state-icon[data-state="on"] {
        background: var(--accent-color);
        color: #fff !important;
      }
      ha-state-icon[data-domain="switch"][data-state="on"] {
        background: var(--secondary-accent-color, var(--state-switch-active-color, var(--state-active-color)));
        color: #fff !important;
      }
      ha-state-icon[data-domain="device_tracker"][data-state="home"] {
        background: var(--state-device_tracker-home-color, var(--state-device_tracker-active-color, var(--state-active-color)));
        color: #fff !important;
      }
      ha-state-icon[data-domain="sensor"][data-state="healthy"] {
        background: var(--state-device_tracker-home-color, var(--state-device_tracker-active-color, var(--state-active-color)));
        color: #fff !important;
      }
      ha-state-icon[data-domain="sensor"][data-state="unhealthy"] {
        background: var(--state-alert-on-color, var(--state-inactive-color));
        color: #fff !important;
      }

  ## CSS styling for all cards
  card-mod-card-yaml: |
    ## Static — every card renders this, so it must contain no Jinja.
    ## Anything templated here costs one server render_template subscription PER CARD.
    ## Shared classes live here too. Inside a layout-card, `card_mod: {class: x}` lands on
    ## the card's ha-card and nowhere else, so gate rules with `ha-card.x`. `:host(.x)` does
    ## not match, and cards with no ha-card (layout-card, chips card) cannot use a class.
    .: |
      ha-card {
        transition: all 0.2s ease-in-out, height 0s, margin 0s !important;
      }
      ha-card.type-custom-button-card:not(.no-hover):hover {
        @media (hover: hover) {
          transform: scale(1.05);
          box-shadow: 1px 3px 10px rgba(0,0,0,0.05);
        }
      }
      .type-glance, .media-player, .type-entities, .type-custom-uptime-card, .type-gauge, .type-custom-mini-graph-card, .type-map, .type-custom-mini-media-player, .type-history-graph, .type-custom-multiple-logbook-card, .type-picture-entity, .type-statistics-graph {
        border-width: 1px;
      }


      ha-card.mini-graph .header {
        padding: 8px 14px 0 !important;
        align-items: center;
      }
      ha-card.mini-graph .name {
        font-size: 15px !important;
        font-weight: 600 !important;
        color: var(--primary-text-color) !important;
      }
      ha-card.mini-graph .icon {
        color: var(--theme-icon-color) !important;
        background: var(--primary-background-color);
        border-radius: 999px;
        width: 32px;
        height: 32px;
        display:flex;
        justify-content: center;
        align-items: center;
        outline: 1px solid var(--primary-background-color);
        outline-offset: 3px;
      }
      ha-card.mini-graph .info {
        padding: 0 14px 14px !important;
      }

      /* class: bare */
      ha-card.bare {
        background: none !important;
        border: 1px solid transparent !important;
      }

      ha-card.chip-entity {
        background-color: {{ 'var(--secondary-accent-color)' if config.entity and is_state(config.entity, 'on') else 'var(--card-background-color)' }} !important;
        --text-color: {{ '#fff' if config.entity and is_state(config.entity, 'on') else 'unset' }} !important;
        --icon-primary-color: {{ '#fff' if config.entity and is_state(config.entity, 'on') else 'unset' }} !important;
      }

      /* class: frigate_events */
      ha-card.frigate_events {
        border-radius: unset;
        padding: 0 4px;
      }
      ha-card.frigate_events .events {
        --visible-count: 5 !important;
      }
      ha-card.frigate_events .events .event {
        border-radius: 10px;
        aspect-ratio: 16/12;
      }
      ha-card.frigate_events .events .event:first-of-type {
        border-radius: 16px;
        grid-column: 1 / -1;
        grid-row: 1;
        aspect-ratio: 16/9;
      }

      /* class: state_value (mini-graph-card) */
      ha-card.state_value .states .state .state__value {
        font-weight: 500;
        letter-spacing: -0.02em;
      }

      /* class: dim_icon (collapsable-cards) */
      ha-card.dim_icon ha-icon {
        color: var(--secondary-text-color) !important;
      }
      ha-card.dim_icon button:focus {
        background: none !important;
      }

      /* class: no_icon */
      ha-card.no_icon state-badge {
        display: none !important;
      }
      ha-card.no_icon .info {
        padding-left: 0 !important;
      }

      /* class: remote_media (mini-media-player) */
      ha-card.remote_media {
        height: 100%;
        letter-spacing: 0.2px;
      }
      ha-card.remote_media .mmp-player__core {
        flex-direction: column-reverse;
      }
      ha-card.remote_media .mmp-player {
        align-self: center;
      }
      ha-card.remote_media mmp-powerstrip {
        justify-content: flex-start !important;
        margin-left: 0;
      }
      ha-card.remote_media .entity__info {
        margin-left: 0;
      }

    ## `&.class` is UIX's host filter: the path only runs when the card carries the class.
    ## Keeps the Jinja scoped so only these cards open a render_template subscription.
    "&.media_card":
      .: |
        {% set bg = config.entity and state_attr(config.entity, "entity_picture") %}
        ha-card {
          border-radius: 20px;
          border: 1px solid var(--ha-card-border-color);
          min-height: 200px;
          @media screen and (min-width: 1200px) {
            min-height: 141px;
          }
        }
        ha-card.fire {
          min-height: 122px;
          height: 100% !important;
        }
        mushroom-card {
          justify-content: flex-end;
          border-radius: 20px;
          overflow: hidden;
          background: linear-gradient(240deg, var(--accent-color) -200%, var(--ha-card-background) 30%);
          {% if bg %}
          --card-primary-color: #fff;
          --card-secondary-color: #FFFFFF90;
          background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.2)), url("{{ bg }}");
          background-position: center;
          background-size: 100%, cover;
          color: #fff;
          {% endif %}
        }
        mushroom-state-item {
          flex-grow: 0;
        }
        mushroom-button {
          {% if bg %}
          --bg-color: rgba(255,255,255, 0.15) !important;
          --bg-color-disabled: rgba(255,255,255, 0.15) !important;
          --icon-color: #fff;
          {% endif %}
        }

      mushroom-card$: |
        .container {
          justify-content: flex-end !important;
          flex-grow: 0 !important;
        }

    .scroll$:
      .: |
        grid-layout {
          --layout-margin: 0 -10px;
          --layout-padding: 4px 16px 4px 10px;
          position: relative;
        }      
        grid-layout::after {
          display: block;
          content: "";
          position: absolute;
          width: 19px;
          height: 100%;
          background: linear-gradient(to left, var(--background-color), transparent);
          right: -10px;
          top: 0;
        }        
        grid-layout::before {
          display: block;
          content: "";
          position: absolute;
          width: 18px;
          height: 100%;
          background: linear-gradient(to right, var(--background-color), transparent);
          left: -16px;
          top: 0;
          z-index:1;
        }  

      grid-layout$: |
        #root {
          scroll-snap-type: x mandatory;
          scroll-padding: 24px;
        } 
        ::-webkit-scrollbar {
          display: none;
        }
        #root > * {
          scroll-snap-align: start;
        }

    mmp-powerstrip$:
      mmp-source-menu$:
        mmp-dropdown$:
          mmp-button$: |
            .slot-container {
              margin-left: 0 !important;
            }       

    mushroom-media-player-media-control$: |
      {% set bg = config.entity and state_attr(config.entity, "entity_picture") %}
      {% if bg %}
      mushroom-button {
        --bg-color: rgba(255,255,255, 0.15) !important;
        --bg-color-disabled: rgba(255,255,255, 0.15) !important;
        --icon-color: #fff;
      }    
      {% endif %}         
    mushroom-media-player-volume-control$: |
      {% set bg = config.entity and state_attr(config.entity, "entity_picture") %}
      {% if bg %}
      mushroom-button {
        --bg-color: rgba(255,255,255, 0.15) !important;
        --bg-color-disabled: rgba(255,255,255, 0.15) !important;
        --icon-color: #fff;
      }
      mushroom-slider {
        --bg-color: rgba(255,255,255, 0.15) !important;
      }
      {% endif %}   
 
  ## More Info
  card-mod-more-info-yaml: |
    .: |
      ha-dialog {  
        
        @media (max-width: 450px), (max-height: 500px) {
          # --ha-dialog-border-radius: 16px 16px 0 0 !important;
          --mdc-dialog-max-width: 100vw !important;
          --mdc-dialog-min-width: 100vw !important;
          --mdc-dialog-min-height: unset !important;
          --mdc-dialog-max-height: 90vh !important;
          --vertical-align-dialog: flex-end !important;
          box-shadow:var(--mdc-dialog-box-shadow, 0px 11px 15px -7px rgba(0, 0, 0, 0.1), 0px 24px 38px 3px rgba(0, 0, 0, 0.1)) !important;
        }
      }
    $: |  
      ha-paper-dialog {
        # border-radius:10px;
      }
      @media (max-width: 450px), (max-height: 500px) {
        .mdc-dialog__surface {
          padding-top: 0 !important;
          border-radius: 20px 20px 0 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
      
    ha-header-bar:
      $: |
        :host {
            border-bottom:0 !important;
        }
        .mdc-top-app-bar {
            background:none !important;
        }
        .mdc-top-app-bar__title {
            opacity:0;
        }
    mwc-tab-bar:
      $: |
        :host {
            border-bottom:0 !important;
        }

  ## Header
  card-mod-root-yaml: |
    .: |
      @media screen and (max-width:870px){
        .header {
          padding-top: 0 !important;
          box-shadow: var(--mdc-top-app-bar-fixed-box-shadow);
          /* clears the Android gesture bar when the navbar sits at the bottom; 12px is the fallback knob */
          padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px) !important;
        }
        .toolbar {
          box-sizing: content-box !important;
          --mdc-icon-button-size: var(--header-height, 56px)
        }
        .edit-mode {
          padding-top: 160px !important;
        }
        .edit-mode .header {
          transform:translateY(calc(-100vh + 100%));
          top: 0 !important;
          bottom: auto !important;
        }
        .edit-mode .header .toolbar {
          padding-top: var(--app-safe-area-inset-top) !important;
          padding-bottom: 0 !important;
        }
        ha-tab-group-tab {
          --ha-tab-group-tab-height: 50px !important;
          border-block-end: unset;
          border-block-start: solid var(--track-width) transparent;
          margin-block-end: unset;
          margin-block-start: -var(--track-width);
        }
        ha-tab-group-tab[aria-selected="true"] {
          border-block-end: unset;
          border-block-start: solid var(--track-width) var(--indicator-color);
          margin-block-end: unset;
          margin-block-start: -var(--track-width);

        }
      }
      ha-tab-group-tab[aria-selected="true"] {
        color: var(--accent-color) !important;
      }


  
