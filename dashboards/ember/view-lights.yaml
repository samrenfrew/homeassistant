# ============================================================================
# Ember · 5c Lights — grouped rails.
# title + "N of M on" → All Lights master toggle → per-room rails → Scenes.
# ============================================================================
title: Lights
path: lights
icon: mdi:lightbulb-group-outline
theme: Ember
type: custom:vertical-layout
layout:
  width: 360
  max_width: 600
  margin: 0 auto
  card_margin: 7px 0

cards:
  # --- Title + count ----------------------------------------------------------
  - type: custom:mushroom-title-card
    title: Lights
    subtitle: >-
      {% set ls = states.light | rejectattr('entity_id','in',['light.all_lights','light.lounge_lights','light.home_assistant_voice_096aed_led_ring']) | list %}{{
      ls | selectattr('state','eq','on') | list | count }} of {{ ls | count }} on
    card_mod:
      style: |
        ha-card { padding: 20px 24px 6px 24px !important; }
        .title { font-family: var(--ha-font-family-body) !important; font-size: 28px !important;
          font-weight: 600 !important; letter-spacing: -0.01em; color: var(--ember-text); }
        .subtitle { font-family: var(--ha-font-family-body) !important; font-size: 13px !important;
          font-weight: 400 !important; line-height: 1.4 !important; margin-top: 2px; color: var(--ember-text-muted); }

  # --- All Lights master toggle ----------------------------------------------
  - type: vertical-stack
    card_mod: &row_group
      style: |
        #root {
          background: var(--ember-surface);
          border: 1px solid var(--ember-border);
          border-radius: 22px;
          box-shadow: var(--ember-card-shadow);
          margin: 0 24px;
          padding: 2px 16px;
          gap: 0 !important;
        }
        #root > *:not(:last-child) { border-bottom: 1px solid var(--ember-divider); }
    cards:
      - type: custom:button-card
        template: ember_toggle_row
        entity: light.all_lights
        name: All Lights
        icon: mdi:lightbulb-group
        label: >-
          [[[ var ls = Object.keys(states).filter(e => e.startsWith("light.") &&
            !["light.all_lights","light.lounge_lights","light.home_assistant_voice_096aed_led_ring"].includes(e));
            var on = ls.filter(e => states[e].state === "on").length;
            return on > 0 ? on + " on" : "All off"; ]]]

  # --- Lounge -----------------------------------------------------------------
  - type: custom:mushroom-title-card
    title: Lounge
    subtitle: >-
      {% set n = ['light.orb_lamp','light.big_lamp','light.small_lamp','light.chair_lamp','light.tv']
      | select('is_state','on') | list | count %}{{ (n ~ ' on') if n > 0 else '' }}
    card_mod: &section_head
      style: |
        ha-card { padding: 14px 24px 2px 24px !important; display: flex !important;
          flex-direction: row !important; justify-content: space-between !important;
          align-items: baseline !important; }
        .title { font-family: var(--ha-font-family-body) !important; font-size: 15px !important;
          font-weight: 600 !important; color: var(--ember-text); }
        .subtitle { font-family: var(--ha-font-family-body) !important; font-size: 12.5px !important;
          font-weight: 400 !important; margin-top: 0 !important; color: var(--ember-text-muted); }
  - type: horizontal-stack
    card_mod: &rail
      style: |
        #root {
          overflow-x: auto; flex-wrap: nowrap !important; scroll-snap-type: x mandatory;
          scrollbar-width: none; gap: 10px !important; padding: 2px 0 4px 0;
          -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent);
          mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent);
        }
        #root::-webkit-scrollbar { display: none; }
        #root > * { flex: 0 0 auto !important; min-width: max-content; }
        #root > *:first-child { margin-left: 24px !important; }
        #root > *:last-child { margin-right: 24px !important; }
    cards:
      - type: custom:button-card
        template: ember_light_tile
        entity: light.orb_lamp
        hold_action:
          action: navigate
          navigation_path: '#light-orb'
          haptic: light
        name: Orb
        icon: mdi:lava-lamp
      - type: custom:button-card
        template: ember_light_tile
        entity: light.big_lamp
        hold_action:
          action: navigate
          navigation_path: '#light-big'
          haptic: light
        name: Big Lamp
        icon: mdi:floor-lamp
      - type: custom:button-card
        template: ember_light_tile
        entity: light.small_lamp
        hold_action:
          action: navigate
          navigation_path: '#light-small'
          haptic: light
        name: Small Lamp
        icon: mdi:lamp
      - type: custom:button-card
        template: ember_light_tile
        entity: light.chair_lamp
        hold_action:
          action: navigate
          navigation_path: '#light-chair'
          haptic: light
        name: Chair
        icon: mdi:lamp
      - type: custom:button-card
        template: ember_light_tile
        entity: light.tv
        hold_action:
          action: navigate
          navigation_path: '#light-tvback'
          haptic: light
        name: TV Backlight
        icon: mdi:television-ambient-light

  # --- Office -----------------------------------------------------------------
  - type: custom:mushroom-title-card
    title: Office
    subtitle: >-
      {% set n = ['light.ikea_plug','light.desk_lamp','light.computer']
      | select('is_state','on') | list | count %}{{ (n ~ ' on') if n > 0 else '' }}
    card_mod: *section_head
  - type: horizontal-stack
    card_mod: *rail
    cards:
      - type: custom:button-card
        template: ember_light_tile
        entity: light.ikea_plug
        name: Cool Lamp
        icon: mdi:desk-lamp
      - type: custom:button-card
        template: ember_light_tile
        entity: light.desk_lamp
        hold_action:
          action: navigate
          navigation_path: '#light-desk'
          haptic: light
        name: Desk Lamp
        icon: mdi:desk-lamp
      - type: custom:button-card
        template: ember_light_tile
        entity: light.computer
        hold_action:
          action: navigate
          navigation_path: '#light-computer'
          haptic: light
        name: Desk
        icon: mdi:monitor

  # --- Nursery ----------------------------------------------------------------
  - type: custom:mushroom-title-card
    title: Nursery
    subtitle: >-
      {% set n = ['light.nursery_lamp'] | select('is_state','on') | list | count
      %}{{ (n ~ ' on') if n > 0 else '' }}
    card_mod: *section_head
  - type: horizontal-stack
    card_mod: *rail
    cards:
      - type: custom:button-card
        template: ember_light_tile
        entity: light.nursery_lamp
        hold_action:
          action: navigate
          navigation_path: '#light-nursery'
          haptic: light
        name: Nursery
        icon: mdi:lamp

  # --- Ella's Room ------------------------------------------------------------
  - type: custom:mushroom-title-card
    title: Ella's Room
    subtitle: >-
      {% set n = ['light.ella_lamp','light.fairy_lights'] | select('is_state','on')
      | list | count %}{{ (n ~ ' on') if n > 0 else '' }}
    card_mod: *section_head
  - type: horizontal-stack
    card_mod: *rail
    cards:
      - type: custom:button-card
        template: ember_light_tile
        entity: light.ella_lamp
        name: Ella
        icon: mdi:lamp
      - type: custom:button-card
        template: ember_light_tile
        entity: light.fairy_lights
        name: Fairy Lights
        icon: mdi:string-lights

  # --- Outside ----------------------------------------------------------------
  - type: custom:mushroom-title-card
    title: Outside
    subtitle: >-
      {% set n = ['light.outside'] | select('is_state','on') | list | count
      %}{{ (n ~ ' on') if n > 0 else '' }}
    card_mod: *section_head
  - type: horizontal-stack
    card_mod: *rail
    cards:
      - type: custom:button-card
        template: ember_light_tile
        entity: light.outside
        name: Outside
        icon: mdi:outdoor-lamp

  # --- Scenes -----------------------------------------------------------------
  - type: custom:mushroom-title-card
    title: Scenes
    card_mod: *section_head
  - type: horizontal-stack
    card_mod: *rail
    cards:
      - type: custom:button-card
        template: ember_scene_chip
        entity: scene.evening
        name: Evening
        icon: mdi:weather-sunset
      - type: custom:button-card
        template: ember_scene_chip
        entity: scene.movie
        name: Movie
        icon: mdi:movie-open
      - type: custom:button-card
        template: ember_scene_chip
        entity: scene.relax
        name: Relax
        icon: mdi:sofa-single
      - type: custom:button-card
        template: ember_scene_chip
        entity: scene.reading
        name: Reading
        icon: mdi:book-open-page-variant
      - type: custom:button-card
        template: ember_scene_chip
        name: Add preset
        icon: mdi:plus
        tap_action:
          action: none
        styles:
          card:
            - background: none
            - border-style: dashed
          icon:
            - color: var(--ember-text-dim)
          name:
            - color: var(--ember-text-dim)

  # --- Light sheets (5k long-press popups) -------------------------------------
  - type: custom:streamline-card
    template: ember_light_sheet
    variables:
      entity: light.orb_lamp
      name: Orb Lamp
      icon: mdi:lava-lamp
      hash: '#light-orb'
  - type: custom:streamline-card
    template: ember_light_sheet
    variables:
      entity: light.big_lamp
      name: Big Lamp
      icon: mdi:floor-lamp
      hash: '#light-big'
  - type: custom:streamline-card
    template: ember_light_sheet
    variables:
      entity: light.small_lamp
      name: Small Lamp
      icon: mdi:lamp
      hash: '#light-small'
  - type: custom:streamline-card
    template: ember_light_sheet
    variables:
      entity: light.chair_lamp
      name: Chair Lamp
      icon: mdi:lamp
      hash: '#light-chair'
  - type: custom:streamline-card
    template: ember_light_sheet
    variables:
      entity: light.tv
      name: TV Backlight
      icon: mdi:television-ambient-light
      hash: '#light-tvback'
  - type: custom:streamline-card
    template: ember_light_sheet
    variables:
      entity: light.desk_lamp
      name: Desk Lamp
      icon: mdi:desk-lamp
      hash: '#light-desk'
  - type: custom:streamline-card
    template: ember_light_sheet
    variables:
      entity: light.computer
      name: Desk
      icon: mdi:monitor
      hash: '#light-computer'
  - type: custom:streamline-card
    template: ember_light_sheet
    variables:
      entity: light.nursery_lamp
      name: Nursery Lamp
      icon: mdi:lamp
      hash: '#light-nursery'

  # --- Navigation (shared bottom bar / side rail) --------------------------
  - !include _navbar.yaml
